services:
  db:
    image: mysql:latest
    container_name: shelved_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: shelved
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: shelved_backend
    depends_on:
      - db
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    volumes:
      - ../:/app

volumes:
  mysql_data:
